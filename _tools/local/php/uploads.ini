; Mounted by docker-compose.yml for local development only; never shipped.
;
; PHP's own limits are 2 MB a file and 8 MB a request. A theme zip or a picture above that,
; sent from the dashboard, is thrown away by PHP before WordPress sees it, and WordPress
; then says "The link you followed has expired." Hosts commonly allow 64 MB or more; so
; does this one. The handoff notes tell the receiver what to do on a host that does not.
upload_max_filesize = 64M
post_max_size = 64M
