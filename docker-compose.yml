# Local WordPress for developing the harlow theme.
#
#   ./_tools/env.sh up            start everything
#   ./_tools/env.sh down          stop (data is kept)
#   ./_tools/env.sh rebuild --yes wipe the database and build the site again from this repository
#
#   WordPress    http://localhost:8090          (admin: see .env, written by the first rebuild)
#   phpMyAdmin   http://localhost:8091          server: db
#   Mailpit      http://localhost:8035          every message WordPress sends lands here
#
# Ports are 809x and 8035, not 808x and 8025, so this stack runs beside the Osous one.
#
# WP-CLI runs as a one-off container:  ./_tools/env.sh wp plugin list
#
# The theme folder and the shared assets are mounted from this repository, so editing a
# file here changes the site immediately: no copying, no build step for PHP.

name: harlow

# One set of WordPress settings for the web server and WP-CLI alike. The image's
# wp-config.php reads these at run time, so a container without them (WP-CLI, at first)
# runs without debug logging or the theme development mode.
x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  # Verbose errors locally, written to wp-content/debug.log and never shown on a page;
  # never carried to a real host.
  WORDPRESS_DEBUG: 1
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'SCRIPT_DEBUG', true );
    define( 'DISALLOW_FILE_EDIT', true );
    // Without this WordPress caches its scan of the theme's patterns, and a pattern
    // added after the first page load does not exist until the cache expires.
    define( 'WP_DEVELOPMENT_MODE', 'theme' );

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: ${WP_IMAGE:-wordpress:php8.3-apache}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:80"
    environment: *wordpress-env
    volumes:
      - wp:/var/www/html
      # The theme under development. `assets/` is mounted separately so the static
      # reference pages at the repository root keep working from the same files.
      - ./theme:/var/www/html/wp-content/themes/harlow
      - ./assets:/var/www/html/wp-content/themes/harlow/assets:ro
      # The static reference served from the same origin as WordPress
      # (http://localhost:8090/static/index.html), so a check can load both versions of a
      # page in one browser context and measure them side by side.
      - ./:/var/www/html/static:ro
      # One must-use plugin that routes wp_mail() to Mailpit (see the file).
      - ./_tools/local/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      # Uploads up to 64 MB, as hosts commonly allow (see the file).
      - ./_tools/local/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

  # Catches everything WordPress tries to send. The image has no mail transport, so without
  # this wp_mail() returns false and every contact form submission reports an error.
  #   Inbox http://localhost:8035   API http://localhost:8035/api/v1/messages
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8035:8025"

  cli:
    image: wordpress:cli
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment: *wordpress-env
    volumes:
      - wp:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/harlow
      - ./assets:/var/www/html/wp-content/themes/harlow/assets:ro
      - ./_tools/local/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      # Plugin zips the host fetched, and database snapshots.
      - ./_env:/env

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8091:80"
    environment:
      PMA_HOST: db
      PMA_USER: wordpress
      PMA_PASSWORD: wordpress
      UPLOAD_LIMIT: 512M

volumes:
  db:
  wp:
